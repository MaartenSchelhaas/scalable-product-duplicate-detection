[project]
name = "scalable-product-duplicate-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MaartenSchelhaas", email = "543694ms@eur.nl" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18",
    "sentence-transformers>=5,<6",
]

[project.optional-dependencies]
dev = [
    "jupyter"
]
# Pick one: torch from PyPI, or torch with Intel GPU (XPU) support from PyTorch's own index
cpu = [
    "torch>=2.5",
]
xpu = [
    "torch>=2.5",
    "pytorch-triton-xpu>=3.3.0",
]

[tool.uv]
conflicts = [
    [{ extra = "cpu" }, { extra = "xpu" }],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-xpu", extra = "xpu" },
]
pytorch-triton-xpu = [
    { index = "pytorch-xpu", extra = "xpu" },
]

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[project.scripts]
scalable-product-duplicate-detection = "scalable_product_duplicate_detection:main"

[build-system]
requires = ["uv_build>=0.11.33,<0.12.0"]
build-backend = "uv_build"
